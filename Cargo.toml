[package]
name = "solana-universal-nft"
version = "0.1.0"
description = "Universal NFT program for Solana with ZetaChain cross-chain compatibility"
edition = "2021"
license = "MIT"
repository = "https://github.com/TokenHarvester/solana-universal-nft"

[lib]
crate-type = ["cdylib", "lib"]
name = "solana_universal_nft"
path = "src/lib.rs"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
# Fixed anchor-lang with init-if-needed feature
anchor-lang = { version = "0.29.0", features = ["init-if-needed"] }
# Fixed anchor-spl with metadata feature
anchor-spl = { version = "0.29.0", features = ["metadata"] }
# Fixed mpl-token-metadata version and features
mpl-token-metadata = { version = "4.1.2", features = ["serde"] }

# Additional dependencies for cross-chain functionality  
borsh = "0.10.3"
bytemuck = "1.14.0"

[dev-dependencies]
solana-program-test = "~1.16.0"
solana-sdk = "~1.16.0"
tokio = { version = "1.0", features = ["macros"] }
anchor-client = "0.29.0"