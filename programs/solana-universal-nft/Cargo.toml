[package]
name = "solana-universal-nft"
version = "0.1.0"
description = "Universal NFT program for Solana with ZetaChain cross-chain compatibility"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "solana_universal_nft"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.29.0", features = ["init-if-needed"] }
anchor-spl = { version = "0.29.0", features = ["metadata"] }
mpl-token-metadata = { version = "3.2.3", features = ["serde"] }
borsh = "0.10.3"
bytemuck = "1.14.0"
